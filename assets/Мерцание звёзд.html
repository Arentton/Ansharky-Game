<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мерцание звёзд</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Исходный размер сцены (как на картинке)
const W = 519, H = 522, U = 4; // U — размер «пикселя» звезды
const Y = '#fbf236', L = '#fffb9f';

const BIG = ['...Y...','...Y...','..YWY..','YYWYWYY','..YWY..','...Y...','...Y...'];
const SMALL = ['..Y..','.YWY.','YWWWY','.YWY.','..Y..'];

// Позиции звёзд: [x, y, большая?]
const STARS = [
  [89.5,18.5,1],[189.5,30.5,0],[293.5,62.5,0],[53.5,66.5,0],[393.5,74.5,0],
  [505.5,102.5,0],[237.5,110.5,0],[157.5,158.5,1],[357.5,178.5,1],[25.5,190.5,0],
  [233.5,198.5,0],[421.5,238.5,0],[133.5,246.5,0],[301.5,282.5,0],[89.5,286.5,0],
  [205.5,310.5,0],[469.5,326.5,1],[365.5,362.5,0],[93.5,386.5,0],[249.5,398.5,0],
  [441.5,410.5,0],[197.5,466.5,1],[101.5,486.5,0],[385.5,494.5,1]
].map(([x, y, b]) => ({
  x, y, shape: b ? BIG : SMALL,
  period: 1.5 + Math.random() * 2.5,   // секунды на цикл мерцания
  phase: Math.random() * Math.PI * 2
}));

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);
resize();

function drawStar(s, alpha) {
  const n = s.shape.length;
  const x0 = Math.round(s.x - n * U / 2 + 0.5);
  const y0 = Math.round(s.y - n * U / 2 + 0.5);
  ctx.globalAlpha = alpha;
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      const c = s.shape[j][i];
      if (c === '.') continue;
      ctx.fillStyle = c === 'W' ? L : Y;
      ctx.fillRect(x0 + i * U, y0 + j * U, U, U);
    }
}

function frame(t) {
  t /= 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Растягиваем сцену на весь экран с сохранением пропорций (cover)
  const k = Math.max(cv.width / W, cv.height / H);
  ctx.setTransform(k, 0, 0, k, (cv.width - W * k) / 2, (cv.height - H * k) / 2);
  ctx.imageSmoothingEnabled = false;

  for (const s of STARS) {
    const v = (Math.sin(t * 2 * Math.PI / s.period + s.phase) + 1) / 2; // 0..1
    const stepped = Math.round(v * 4) / 4;                              // ступенчато, в пиксельном стиле
    drawStar(s, 0.15 + 0.85 * stepped);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
